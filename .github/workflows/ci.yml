name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: Smoke test (demo + mock GraphQL)
        run: node scripts/smoke.mjs

      # Опционально: деплой через Render Deploy Hook.
      # Добавьте секрет RENDER_DEPLOY_HOOK (Settings → Deploy Hook в Render).
      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
