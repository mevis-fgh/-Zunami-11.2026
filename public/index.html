<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Сеть глазами Бога — GraphQL Coverage Proxy</title>
    <meta
      name="description"
      content="Прокси между тестами и GraphQL API: покрытие схемы, граф типов, история прогонов."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%237c5cff'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23070b14'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/overview" aria-label="Сеть глазами Бога">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="28" height="28"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".9"/><circle cx="20" cy="20" r="6" fill="currentColor"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/><circle cx="34.5" cy="28" r="2.6" fill="currentColor"/><circle cx="5.5" cy="28" r="2.6" fill="currentColor"/></svg>
        </span>
        <span class="brand-text">
          <strong>Сеть глазами Бога</strong>
          <small>GraphQL Coverage Proxy</small>
        </span>
      </a>

      <div class="topbar-center">
        <span class="pill pill-schema" id="schema-pill" title="Активная схема">
          <span class="dot"></span><span id="schema-pill-text">загрузка…</span>
        </span>
      </div>

      <div class="topbar-actions">
        <button class="btn ghost" id="btn-refresh" title="Перезагрузить данные">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Обновить</span>
        </button>
        <button class="btn ghost" id="btn-schema" title="Схемы и настройки">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Схема</span>
        </button>
        <button class="icon-btn" id="btn-settings" title="Настройки доступа" aria-label="Настройки">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="app">
      <nav class="sidebar" id="sidebar" aria-label="Навигация"></nav>
      <section class="content">
        <div class="filterbar" id="filterbar"></div>
        <main class="view" id="view" tabindex="-1"></main>
      </section>
    </div>

    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toasts" id="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
